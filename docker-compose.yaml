volumes:
  mysql_data:
  var_data:
  etc_data:

networks:
  defaultnet:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: freepbxint
    ipam:
      driver: default
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1

secrets:
  mysql_root_password:
    file: mysql_root_password.txt
  freepbxuser_password:
    file: freepbxuser_password.txt
  postfix_sasl_passwd:
    file: sasl_passwd.txt

services:
  db:
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_USER: freepbxuser
      MYSQL_PASSWORD_FILE: /run/secrets/freepbxuser_password
    secrets:
      - mysql_root_password
      - freepbxuser_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./my.cnf:/etc/mysql/my.cnf:ro
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      defaultnet:
        ipv4_address: 172.18.0.10

  freepbx:    
    # (Optional) Override safe_asterisk's automatic open-file limit.
    # The value must not exceed the container's hard nofile limit.
    # Set it to your needs.
    # environment:
    #   MAXFILES: "32768"
    restart: always
    image: escomputers/freepbx:17-nofail2ban
    healthcheck:
      test:
        - CMD-SHELL
        - |
          timeout 5s asterisk -rx 'core waitfullybooted' |
            grep -Fq 'Asterisk has fully booted.' || exit 1

          if [ -f /etc/freepbx.conf ]; then
            path=/admin/config.php
          elif [ ! -f /var/www/html/admin/config.php ]; then
            path=/
          else
            exit 1
          fi

          for scheme in http https; do
            status=$$(curl --silent --insecure --max-time 5 \
              --noproxy '*' \
              --output /dev/null --write-out '%{http_code}' \
              "$$scheme://127.0.0.1$$path") || continue

            case "$$status" in
              200|301|302|303|307|308) exit 0 ;;
            esac
          done

          echo 'Neither HTTP nor HTTPS returned an accepted status.' >&2
          exit 1
      start_period: 10m
      interval: 10s
      timeout: 20s
      retries: 3
    volumes:
      - var_data:/var
      - etc_data:/etc
    networks:
      defaultnet:
        ipv4_address: 172.18.0.20
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "5060:5060/udp"
    secrets:
      - postfix_sasl_passwd
    depends_on:
      db:
        condition: service_healthy

  fail2ban:
    restart: unless-stopped
    image: lscr.io/linuxserver/fail2ban:latest
    container_name: fail2ban
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      PUID: 1000
      PGID: 2000
      TZ: UTC
    volumes:
      - var_data:/remotelogs/freepbx:ro
      - ./source/fail2ban/jail.local:/config/fail2ban/jail.local
      - ./source/fail2ban/filter.d/asterisk.conf:/config/fail2ban/filter.d/asterisk.conf
    depends_on:
      - freepbx
