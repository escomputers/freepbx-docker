# Scan the published FreePBX image and prepare a list of verified Debian security updates.
# Save the scan report and open a pull request for new verified updates from main.
name: Security update check

on:
  push:
    branches: [feature/add-workflows]  # temporary development branch
    paths:
      - .github/workflows/security-updates.yml
      - .github/scripts/prepare_security_updates.py
      - source/packages/packages.tsv
  # For manual runs
  workflow_dispatch:

# Only the pull request job needs write access.
permissions:
  contents: read

# Let an active check finish and prevent concurrent runs of this workflow
concurrency:
  group: security-update-check
  cancel-in-progress: false

jobs:
  scan:
    name: Scan and prepare security updates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      report-id: ${{ steps.report.outputs.artifact-id }}
    env:
      # Image to scan and prepare updates for
      PUBLISHED_IMAGE: docker.io/escomputers/freepbx:17-nofail2ban
      # Update the scanner version and its release-archive checksum together
      TRIVY_VERSION: 0.76.2
      TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
      REPORT_DIR: security-report
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the approved manifest and preparation script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Later Docker commands only need files, not repository credentials.
          persist-credentials: false

      - name: Resolve the published image digest
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"

          # Resolve the moving tag to a digest
          digest=$(docker buildx imagetools inspect "$PUBLISHED_IMAGE" \
            --format '{{.Manifest.Digest}}')

          # Validate the digest format
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="${PUBLISHED_IMAGE%:*}@$digest"

          # Pass the exact image reference to subsequent steps.
          printf 'SCAN_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"

      - name: Download and verify Trivy
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/trivy-bin"
          mkdir -p "$tool_dir"
          archive="$tool_dir/trivy.tar.gz"

          curl --proto '=https' --proto-redir '=https' \
            --fail --silent --show-error --location \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output "$archive"
          # Verify the downloaded archive's SHA-256 checksum
          printf '%s  %s\n' "$TRIVY_SHA256" "$archive" | sha256sum --check --strict -

          tar -xzf "$archive" -C "$tool_dir" trivy

          # GITHUB_PATH makes the verified executable available to later steps.
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"

      - name: Scan Debian HIGH and CRITICAL vulnerabilities
        run: |
          set -euo pipefail
          # Continue when vulnerabilities are found
          # Stop the job if Trivy cannot complete the scan
          # Scan only OS packages managed by Debian's package manager.
          trivy image --image-src remote --platform linux/amd64 \
            --scanners vuln --pkg-types os --severity HIGH,CRITICAL \
            --format json --output "$REPORT_DIR/trivy.json" \
            --timeout 15m "$SCAN_IMAGE"

          # Quick check that the image is a Debian 12 variant with a package database.
          jq --exit-status '
            .Metadata.OS.Family == "debian" and
            (.Metadata.OS.Name | startswith("12")) and
            any(.Results[]?; .Class == "os-pkgs" and .Type == "debian")
          ' "$REPORT_DIR/trivy.json" > /dev/null

      - name: Summarize the scan
        run: |
          set -euo pipefail

          # Count Debian vulnerability findings, since one package can have several CVEs
          findings=$(jq '[.Results[]? | select(.Class == "os-pkgs" and .Type == "debian") |
            .Vulnerabilities[]?] | length' \
            "$REPORT_DIR/trivy.json")
          debian_fixed=$(jq '[.Results[]? | select(.Class == "os-pkgs" and .Type == "debian") |
            .Vulnerabilities[]? | select((.FixedVersion // "") != "")] | length' "$REPORT_DIR/trivy.json")

          # These scan counts describe reported vulnerabilities, before APT checks
          # whether the corresponding fixes are available and installable together.
          {
            printf '## Published image security check\n\n'
            printf -- '- Image: `%s`\n' "$SCAN_IMAGE"
            printf -- '- Platform: `linux/amd64`\n'
            printf -- '- Debian HIGH/CRITICAL findings: %s\n' "$findings"
            printf -- '- Debian findings with a reported fixed version: %s\n\n' "$debian_fixed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare and verify the package manifest proposal
        run: |
          set -euo pipefail

          # A previous failed attempt must not leave an old update proposal
          rm -f "$REPORT_DIR/packages-proposed.tsv"

          # Use the scanned image's own package database in a container.
          container=$(docker create --platform linux/amd64 --entrypoint python3 \
            "$SCAN_IMAGE" \
            -u /tmp/prepare_security_updates.py \
            --report /tmp/trivy.json \
            --manifest /tmp/packages.tsv \
            --output /tmp/packages-proposed.tsv)

          # Remove the container when this shell exits, including after a failed step.
          trap 'docker rm --force "$container" > /dev/null || true' EXIT

          # Copy the script, approved manifest and scan report into the analysis container.
          docker cp .github/scripts/prepare_security_updates.py \
            "$container:/tmp/prepare_security_updates.py"
          docker cp source/packages/packages.tsv "$container:/tmp/packages.tsv"
          docker cp "$REPORT_DIR/trivy.json" "$container:/tmp/trivy.json"

          # Show progress on screen and save it to the log.
          # With pipefail, an error in docker start or tee causes the step to fail.
          docker start --attach "$container" \
            | tee "$REPORT_DIR/package-proposal.txt"
          # Also require Python to finish successfully inside the container (exit code 0).
          [[ "$(docker inspect --format '{{.State.ExitCode}}' "$container")" == 0 ]]

          docker cp "$container:/tmp/packages-proposed.tsv" "$REPORT_DIR/packages-proposed.tsv"

          {
            printf '\n## Package manifest proposal\n\n'
            tail -n 1 "$REPORT_DIR/package-proposal.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the scan report
        id: report
        # Preserve any generated reports even if an earlier step fails.
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: warn
          retention-days: 30

  propose:
    name: Open the security update pull request
    needs: scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Check out the commit used by the scan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Open a pull request when new updates are available
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_ID: ${{ needs.scan.outputs.report-id }}
          LC_ALL: C
        run: |
          set -euo pipefail
          manifest=source/packages/packages.tsv
          branch_prefix=automation/security-updates-
          proposal="$RUNNER_TEMP/packages-proposed.tsv"

          # Use the scan job's artifact ID so rerunning this job alone works too.
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$REPORT_ID/zip" > "$RUNNER_TEMP/security-report.zip"
          unzip -p "$RUNNER_TEMP/security-report.zip" packages-proposed.tsv > "$proposal"

          # Compare only package versions added or changed relative to main.
          updates=$(awk -F '\t' '
            NR == FNR { approved[$1] = $2 ""; next }
            !($1 in approved) || approved[$1] != ($2 "") { print $1 "\t" $2 }
          ' "$manifest" "$proposal" | sort -u)
          if [[ -z "$updates" ]]; then
            echo 'No new package versions to propose.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Identify this workflow's PRs by their branch names in this repository.
          pulls=$(gh api --paginate --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f base=main -f state=all -f sort=created -f direction=desc -F per_page=100 \
            --jq '.[] | select(.head.repo.full_name == .base.repo.full_name) |
              {number, state, merged_at, branch: .head.ref}')
          previous=$(jq -cs --arg prefix "$branch_prefix" '
            map(select(.branch | startswith($prefix))) |
            (map(select(.state == "open"))[0] //
              map(select(.state == "closed" and .merged_at == null))[0] // {})
          ' <<< "$pulls")
          number=$(jq -r '.number // empty' <<< "$previous")
          state=$(jq -r '.state // empty' <<< "$previous")
          if [[ "$state" == open ]]; then
            printf 'PR #%s is already open. New scan results are available in the report.\n' "$number" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          new_updates="$updates"
          if [[ "$state" == closed ]]; then
            # Compare with the packages and versions proposed in the closed PR.
            patch=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number/files" \
              --jq '.[] | select(.filename == "source/packages/packages.tsv") | .patch // empty')
            if [[ -z "$patch" ]]; then
              echo "Could not read the package changes from PR #$number." >&2
              exit 1
            fi
            previous_updates=$(awk -F '\t' '
              /^-[^-]/ { before[substr($1, 2)] = $2 "" }
              /^\+[^+]/ { after[substr($1, 2)] = $2 "" }
              END {
                for (name in after)
                  if (!(name in before) || before[name] != after[name]) print name "\t" after[name]
              }
            ' <<< "$patch" | sort -u)
            new_updates=$(comm -23 <(printf '%s\n' "$updates") <(printf '%s\n' "$previous_updates"))
            if [[ -z "$new_updates" ]]; then
              printf 'No new package versions since PR #%s was closed without merging.\n' "$number" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          # The scan verified its proposal against the manifest at this commit.
          git fetch --no-tags --depth=1 origin refs/heads/main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo 'Main changed during the scan. Run a new scan to open a PR.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Give each new PR its own branch so closed PRs keep their original commits.
          branch="$branch_prefix$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$proposal" "$manifest"
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Update Debian security packages' -- "$manifest"
          git push origin "HEAD:refs/heads/$branch"

          body="$RUNNER_TEMP/security-pr.md"
          {
            printf 'This PR updates the Debian security package manifest with the complete set verified in the [scan report](%s/%s/actions/runs/%s).\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            if [[ "$new_updates" != "$updates" ]]; then
              printf '\nNew package versions since PR #%s was closed:\n\n' "$number"
              awk -F '\t' '{ printf "- `%s` `%s`\n", $1, $2 }' <<< "$new_updates"
            fi
          } > "$body"
          pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title 'Update Debian security packages' --body-file "$body")
          printf '[Security update pull request](%s)\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"
