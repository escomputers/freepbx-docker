name: Build FreePBX image

on:
  # Test the workflow on the development branch before enabling release tags.
  push:
    branches:
      - feature/add-publish-wf
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the FreePBX image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the linux/amd64 image
        id: image
        run: docker build --platform linux/amd64 --tag "freepbx:${GITHUB_SHA}" ./source

      - name: Prepare the fresh installation
        run: |
          umask 077
          openssl rand -hex 24 > mysql_root_password.txt
          openssl rand -hex 24 > freepbxuser_password.txt
          printf '%s\n' '[smtp.example.invalid]:587 test:unused' > sasl_passwd.txt

          # Give the local build the image name used by the project's Compose file.
          compose_image=$(docker compose config --format json | jq -er '.services.freepbx.image')
          docker image tag "freepbx:${GITHUB_SHA}" "$compose_image"
          echo "COMPOSE_IMAGE=$compose_image" >> "$GITHUB_ENV"

      - name: Start the project and install FreePBX
        run: |
          sudo bash run.sh
          sudo bash run.sh --install-freepbx

      - name: Verify the installed PBX
        run: |
          bash .github/scripts/check-installed-pbx.sh
          container=$(docker compose ps -q freepbx)
          image_id=$(docker inspect --format '{{.Image}}' "$container")
          echo "TESTED_IMAGE_ID=$image_id" >> "$GITHUB_ENV"

      - name: Install the published image for the upgrade test
        run: |
          # Release the ports and bridge. Use a separate project's volumes for this installation.
          docker compose down
          echo 'COMPOSE_PROJECT_NAME=freepbx-upgrade-test' >> .env
          docker pull "$COMPOSE_IMAGE"
          sudo bash run.sh
          sudo bash run.sh --install-freepbx

          system_id="upgrade-test-${GITHUB_RUN_ID}"
          docker compose exec -T freepbx fwconsole setting FREEPBX_SYSTEM_IDENT "$system_id"
          bash .github/scripts/check-installed-pbx.sh "$system_id"
          echo "TEST_SYSTEM_ID=$system_id" >> "$GITHUB_ENV"

      - name: Upgrade FreePBX with the existing volumes
        run: |
          docker image tag "freepbx:${GITHUB_SHA}" "$COMPOSE_IMAGE"
          docker compose up -d --no-deps --pull never --force-recreate --wait --wait-timeout 600 freepbx
          container=$(docker compose ps -q freepbx)
          test "$(docker inspect --format '{{.Image}}' "$container")" = "$TESTED_IMAGE_ID"
          bash .github/scripts/check-installed-pbx.sh "$TEST_SYSTEM_ID"

      - name: Verify the upgraded PBX after restart and recreation
        shell: bash
        run: |
          check_after_start() {
            bash .github/scripts/check-installed-pbx.sh "$TEST_SYSTEM_ID"
            # Only inspect logs from this start: the first upgrade may have installed packages.
            container=$(docker compose ps -q freepbx)
            started=$(docker inspect --format '{{.State.StartedAt}}' "$container")
            docker logs --since "$started" "$container" 2>&1 |
              grep -F '[security] Packages are already up to date; skipping installation.'
          }

          docker compose restart freepbx
          docker compose up -d --no-deps --pull never --wait --wait-timeout 600 freepbx
          check_after_start

          docker compose up -d --no-deps --pull never --force-recreate --wait --wait-timeout 600 freepbx
          check_after_start

      - name: Summarize the build
        if: always()
        env:
          BUILD_RESULT: ${{ steps.image.outcome }}
        run: |
          {
            printf '## FreePBX image build\n\n'
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Platform: `linux/amd64`\n'
            printf -- '- Build result: %s\n' "$BUILD_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
